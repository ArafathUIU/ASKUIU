<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="ASKUIU - AI assistant for United International University"/>
  <title>ASKUIU - Chat Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-brand-50 dark:bg-gray-900 h-screen flex flex-col transition-colors duration-300">
  <!-- Header -->
  <header class="bg-gradient-to-r from-brand-500 to-brand-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
          <i class="fas fa-comment-dots text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold">ASKUIU</h1>
          <p class="text-xs text-brand-100">Your UIU assistant</p>
        </div>
      </div>
      <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/20 transition" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Chat Body -->
  <main class="flex-1 container mx-auto max-w-3xl w-full p-4 flex flex-col overflow-hidden">
    <div class="flex flex-col bg-white dark:bg-gray-800 rounded-2xl shadow-lg h-full overflow-hidden border border-brand-100 dark:border-gray-700 transition-colors duration-300">
      <!-- Chat Header -->
      <div class="p-4 bg-brand-100 dark:bg-gray-700 border-b border-brand-200 dark:border-gray-600 flex items-center transition-colors duration-300">
        <div class="w-10 h-10 rounded-full bg-brand-300 dark:bg-brand-600 flex items-center justify-center mr-3">
          <i class="fas fa-robot text-brand-700 dark:text-white"></i>
        </div>
        <div>
          <h3 class="font-semibold text-brand-800 dark:text-white">ASKUIU Assistant</h3>
          <p class="text-xs text-brand-600 dark:text-brand-200">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span> Online
          </p>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-brand-50 dark:bg-gray-900 custom-scrollbar transition-colors duration-300">
        <!-- Welcome message -->
        <div class="flex items-start space-x-2 message-entry">
          <div class="w-8 h-8 rounded-full bg-brand-300 dark:bg-brand-600 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-robot text-brand-700 dark:text-white text-sm"></i>
          </div>
          <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl rounded-tl-none shadow-sm border border-brand-100 dark:border-gray-700 max-w-md transition-colors duration-300">
            <p class="text-gray-800 dark:text-gray-100">Hello! I'm ASKUIU, your friendly assistant for United International University. How can I help you today?</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" data-timestamp></p>
          </div>
        </div>

        <!-- Quick Questions -->
        <div id="quick-questions" class="flex flex-wrap gap-2 pl-10 message-entry">
          <button class="quick-question px-3 py-1.5 bg-white dark:bg-gray-800 border border-brand-200 dark:border-gray-600 text-brand-700 dark:text-brand-300 rounded-full text-sm hover:bg-brand-100 dark:hover:bg-gray-700 transition">
            What are the top programs at UIU?
          </button>
          <button class="quick-question px-3 py-1.5 bg-white dark:bg-gray-800 border border-brand-200 dark:border-gray-600 text-brand-700 dark:text-brand-300 rounded-full text-sm hover:bg-brand-100 dark:hover:bg-gray-700 transition">
            Tell me about scholarships
          </button>
          <button class="quick-question px-3 py-1.5 bg-white dark:bg-gray-800 border border-brand-200 dark:border-gray-600 text-brand-700 dark:text-brand-300 rounded-full text-sm hover:bg-brand-100 dark:hover:bg-gray-700 transition">
            Who is the CSE head?
          </button>
          <button class="quick-question px-3 py-1.5 bg-white dark:bg-gray-800 border border-brand-200 dark:border-gray-600 text-brand-700 dark:text-brand-300 rounded-full text-sm hover:bg-brand-100 dark:hover:bg-gray-700 transition">
            Campus facilities
          </button>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator hidden px-4 py-2 bg-brand-100 dark:bg-gray-700 transition-colors duration-300">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-full bg-brand-300 dark:bg-brand-600 flex items-center justify-center mr-2">
            <i class="fas fa-robot text-brand-700 dark:text-white text-sm"></i>
          </div>
          <div class="flex space-x-1">
            <div class="w-2 h-2 rounded-full bg-brand-500 animate-bounce"></div>
            <div class="w-2 h-2 rounded-full bg-brand-500 animate-bounce delay-150"></div>
            <div class="w-2 h-2 rounded-full bg-brand-500 animate-bounce delay-300"></div>
          </div>
        </div>
      </div>

      <!-- Message Input -->
      <form id="query-form" class="border-t border-brand-200 dark:border-gray-600 bg-white dark:bg-gray-800 p-3 transition-colors duration-300">
        <div class="flex items-center">
          <div class="flex-1 relative">
            <input type="text" id="user_message" name="user_message" placeholder="Type your message..."
              class="w-full p-3 pr-12 rounded-full border border-brand-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-300 dark:focus:ring-brand-500 transition"/>
          </div>
          <button type="submit" id="send-button"
            class="ml-2 p-3 rounded-full bg-brand-500 text-white hover:bg-brand-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
            aria-label="Send message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-2 text-center">Press Enter to send</p>
      </form>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
