<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="ASKUIU - AI assistant for United International University"/>
  <title>ASKUIU - United International University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Open Sans"', 'sans-serif'],
          },
          colors: {
            uiu: {
              orange: '#F68B1F',
              'orange-hover': '#E07D18',
              'orange-light': '#FFF5E8',
              dark: '#282828',
              black: '#1A1A1A',
              gray: '#F5F5F5',
              'gray-100': '#EFEFEF',
              'gray-200': '#E5E5E5',
              'gray-600': '#6B7280',
              'gray-700': '#374151',
              'gray-800': '#1F2937',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-uiu-gray dark:bg-uiu-black h-screen flex flex-col font-sans transition-colors duration-300">
  <!-- Top Global Bar (UIU style) -->
  <div class="bg-uiu-black text-white text-xs py-2">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <span class="text-gray-300 hidden sm:inline">United International University</span>
      <div class="flex items-center gap-4 ml-auto">
        <a href="https://www.uiu.ac.bd/" target="_blank" rel="noopener" class="hover:text-uiu-orange transition">uiu.ac.bd <i class="fas fa-external-link-alt text-[10px] ml-0.5"></i></a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-white dark:bg-uiu-dark border-b border-uiu-gray-200 dark:border-gray-700 shadow-sm">
    <div class="container mx-auto px-4 h-16 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <a href="https://www.uiu.ac.bd/" target="_blank" rel="noopener" class="flex items-center" title="United International University">
          <img src="/static/uiu-logo.png" alt="UIU Logo" class="h-10 w-auto object-contain" />
        </a>
        <div class="h-8 w-px bg-uiu-gray-200 dark:border-gray-600 hidden sm:block"></div>
        <div class="hidden sm:block">
          <h1 class="text-lg font-bold text-uiu-black dark:text-white leading-tight">ASKUIU</h1>
          <p class="text-[11px] text-uiu-gray-600 dark:text-gray-400 uppercase tracking-wide">AI Assistant</p>
        </div>
      </div>
      <button id="theme-toggle" class="w-10 h-10 rounded-full border border-uiu-gray-200 dark:border-gray-600 hover:bg-uiu-gray-100 dark:hover:bg-gray-700 transition flex items-center justify-center text-uiu-dark dark:text-white" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Chat Body -->
  <main class="flex-1 container mx-auto max-w-3xl w-full p-4 flex flex-col overflow-hidden">
    <div class="flex flex-col bg-white dark:bg-uiu-dark rounded-xl shadow-lg h-full overflow-hidden border border-uiu-gray-200 dark:border-gray-700 transition-colors duration-300 relative">
      <!-- Accent top bar -->
      <div class="h-1.5 bg-gradient-to-r from-uiu-orange via-[#ff9f43] to-uiu-orange"></div>

      <!-- Chat Header -->
      <div class="p-4 border-b border-uiu-gray-200 dark:border-gray-700 flex items-center justify-between transition-colors duration-300">
        <div class="flex items-center">
          <div class="w-11 h-11 rounded-full bg-uiu-orange-light dark:bg-uiu-orange/20 flex items-center justify-center mr-3 border-2 border-uiu-orange/20">
            <i class="fas fa-robot text-uiu-orange text-lg"></i>
          </div>
          <div>
            <h3 class="font-bold text-uiu-black dark:text-white">ASKUIU Assistant</h3>
            <p class="text-xs text-uiu-gray-600 dark:text-gray-400 flex items-center">
              <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5 animate-pulse"></span> Online
            </p>
          </div>
        </div>
        <a href="https://www.uiu.ac.bd/contact-us/" target="_blank" rel="noopener" class="hidden sm:flex items-center gap-2 text-xs font-semibold text-uiu-orange hover:text-uiu-orange-hover transition">
          <i class="fas fa-headset"></i> Contact UIU
        </a>
      </div>

      <!-- Messages Area -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-5 bg-uiu-gray dark:bg-uiu-black custom-scrollbar transition-colors duration-300">
        <!-- Welcome message -->
        <div class="flex items-start space-x-3 message-entry">
          <div class="w-9 h-9 rounded-full bg-uiu-orange text-white flex items-center justify-center flex-shrink-0 shadow-sm">
            <i class="fas fa-robot text-sm"></i>
          </div>
          <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl rounded-tl-none shadow-sm border border-uiu-gray-200 dark:border-gray-700 max-w-md transition-colors duration-300">
            <p class="text-uiu-black dark:text-gray-100 leading-relaxed">Hello! I'm <strong>ASKUIU</strong>, your friendly assistant for United International University. How can I help you today?</p>
            <p class="text-[11px] text-uiu-gray-600 dark:text-gray-400 mt-2" data-timestamp></p>
          </div>
        </div>

        <!-- Quick Questions -->
        <div id="quick-questions" class="flex flex-wrap gap-2 pl-12 message-entry">
          <button class="quick-question px-4 py-2 bg-white dark:bg-gray-800 border border-uiu-gray-200 dark:border-gray-600 text-uiu-dark dark:text-gray-200 rounded-full text-sm font-medium hover:border-uiu-orange hover:text-uiu-orange dark:hover:text-uiu-orange transition shadow-sm">
            What are the top programs at UIU?
          </button>
          <button class="quick-question px-4 py-2 bg-white dark:bg-gray-800 border border-uiu-gray-200 dark:border-gray-600 text-uiu-dark dark:text-gray-200 rounded-full text-sm font-medium hover:border-uiu-orange hover:text-uiu-orange dark:hover:text-uiu-orange transition shadow-sm">
            Tell me about scholarships
          </button>
          <button class="quick-question px-4 py-2 bg-white dark:bg-gray-800 border border-uiu-gray-200 dark:border-gray-600 text-uiu-dark dark:text-gray-200 rounded-full text-sm font-medium hover:border-uiu-orange hover:text-uiu-orange dark:hover:text-uiu-orange transition shadow-sm">
            Who is the CSE head?
          </button>
          <button class="quick-question px-4 py-2 bg-white dark:bg-gray-800 border border-uiu-gray-200 dark:border-gray-600 text-uiu-dark dark:text-gray-200 rounded-full text-sm font-medium hover:border-uiu-orange hover:text-uiu-orange dark:hover:text-uiu-orange transition shadow-sm">
            Campus facilities
          </button>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator hidden px-4 py-3 bg-uiu-gray dark:bg-uiu-black border-t border-uiu-gray-200 dark:border-gray-700 transition-colors duration-300">
        <div class="flex items-center">
          <div class="w-9 h-9 rounded-full bg-uiu-orange text-white flex items-center justify-center mr-3">
            <i class="fas fa-robot text-sm"></i>
          </div>
          <div class="flex space-x-1.5 bg-white dark:bg-gray-800 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-uiu-gray-200 dark:border-gray-700">
            <div class="w-2 h-2 rounded-full bg-uiu-orange animate-bounce"></div>
            <div class="w-2 h-2 rounded-full bg-uiu-orange animate-bounce delay-150"></div>
            <div class="w-2 h-2 rounded-full bg-uiu-orange animate-bounce delay-300"></div>
          </div>
        </div>
      </div>

      <!-- Message Input -->
      <form id="query-form" class="border-t border-uiu-gray-200 dark:border-gray-700 bg-white dark:bg-uiu-dark p-4 transition-colors duration-300">
        <div class="flex items-center gap-3">
          <div class="flex-1 relative">
            <input type="text" id="user_message" name="user_message" placeholder="Ask anything about UIU..."
              class="w-full p-3.5 pr-12 rounded-full border border-uiu-gray-200 dark:border-gray-600 bg-uiu-gray dark:bg-gray-800 text-uiu-black dark:text-white placeholder-uiu-gray-600 focus:outline-none focus:ring-2 focus:ring-uiu-orange/50 focus:border-uiu-orange transition"/>
          </div>
          <button type="submit" id="send-button"
            class="p-3.5 rounded-full bg-uiu-orange text-white hover:bg-uiu-orange-hover transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
            aria-label="Send message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <p class="text-[11px] text-uiu-gray-600 dark:text-gray-500 mt-2 text-center">Press <kbd class="px-1.5 py-0.5 bg-uiu-gray-200 dark:bg-gray-700 rounded text-[10px]">Enter</kbd> to send</p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-uiu-dark border-t border-uiu-gray-200 dark:border-gray-700 py-3">
    <div class="container mx-auto px-4 text-center text-[11px] text-uiu-gray-600 dark:text-gray-500">
      <span class="font-semibold text-uiu-orange">ASKUIU</span> &copy; <span id="year"></span> United International University. All rights reserved.
    </div>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
