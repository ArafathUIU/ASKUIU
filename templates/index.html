<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASKUIU - UIU Q&A System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="particles" id="particles"></div>
    <div class="container mx-auto max-w-4xl p-4">
        <!-- Header -->
        <header class="bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-t-xl p-4 shadow-lg">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="avatar">
                        <i class="fas fa-smile-beam"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">ASKUIU</h1>
                        <p class="text-xs opacity-80">United International University</p>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button class="p-2 rounded-full bg-white bg-opacity-20 hover:bg-opacity-30 transition" aria-label="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="p-2 rounded-full bg-white bg-opacity-20 hover:bg-opacity-30 transition" aria-label="Help">
                        <i class="fas fa-question-circle"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="bg-white shadow-lg rounded-b-xl overflow-hidden">
            <!-- Chat Messages -->
            <div class="chat-container overflow-y-auto p-4 space-y-4" id="chat-messages" style="height: calc(100vh - 180px);">
                <!-- Welcome Message -->
                <div class="flex items-start">
                    <div class="bg-orange-100 p-3 rounded-full mr-3">
                        <i class="fas fa-robot text-orange-500 text-xl"></i>
                    </div>
                    <div class="message p-4 bot-message">
                        <p class="font-medium text-orange-800">Hello! I'm ASKUIU, your AI assistant for UIU.</p>
                        <p class="mt-1 text-gray-700">Ask me anything about UIU's academic rules, syllabi, or campus info. You can type or use the microphone to speak!</p>
                        <div class="mt-3 flex flex-wrap gap-2">
                            <button class="suggested-question bg-white text-orange-600 px-3 py-1 rounded-full text-sm border border-orange-200 hover:bg-orange-50 hover:shadow-sm">
                                What are UIU's academic regulations?
                            </button>
                            <button class="suggested-question bg-white text-orange-600 px-3 py-1 rounded-full text-sm border border-orange-200 hover:bg-orange-50 hover:shadow-sm">
                                How can I contact a faculty member?
                            </button>
                            <button class="suggested-question bg-white text-orange-600 px-3 py-1 rounded-full text-sm border border-orange-200 hover:bg-orange-50 hover:shadow-sm">
                                What's the academic calendar for 2025?
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t border-gray-300 p-4 bg-white">
                <div class="flex items-center space-x-2">
                    <button class="p-2 text-gray-500 hover:text-orange-600 rounded-full hover:bg-gray-200" id="mic-button" aria-label="Record voice">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <div class="flex-1 relative">
                        <textarea id="user-input" rows="1" placeholder="Ask ASKUIU anything..." class="w-full p-3 pr-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-none" style="min-height: 50px;"></textarea>
                        <button id="send-button" class="absolute right-3 bottom-3 p-1 bg-orange-500 text-white rounded-full hover:bg-orange-600 transition" aria-label="Send message">
                            <i class="fas fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>
                <div class="mt-2 flex justify-between items-center text-xs text-gray-500">
                    <div>
                        <span>ASKUIU v1.0 • RAG enabled</span>
                    </div>
                    <div class="flex space-x-2">
                        <button class="hover:text-orange-600">Privacy</button>
                        <button class="hover:text-orange-600">Feedback</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
