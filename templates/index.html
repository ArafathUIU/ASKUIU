<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASKUIU - Chat Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>

<body class="bg-orange-50 h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-gradient-to-r from-orange-500 to-orange-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-orange-300 flex items-center justify-center">
          <i class="fas fa-comment-dots text-orange-700 text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold">ASKUIU</h1>
      </div>
      <div class="flex items-center space-x-4">
        <button class="p-2 rounded-full hover:bg-orange-400 transition"><i class="fas fa-search"></i></button>
        <button class="p-2 rounded-full hover:bg-orange-400 transition"><i class="fas fa-ellipsis-v"></i></button>
      </div>
    </div>
  </header>

  <!-- Chat Body -->
  <main class="flex-1 container mx-auto max-w-3xl w-full p-4 flex flex-col overflow-hidden">
    <!-- Chat Box -->
    <div class="flex flex-col bg-white rounded-lg shadow-md h-full overflow-hidden">
      <!-- Chat Header -->
      <div class="p-4 bg-orange-100 border-b border-orange-200 flex items-center">
        <div class="w-10 h-10 rounded-full bg-orange-300 flex items-center justify-center mr-3">
          <i class="fas fa-robot text-orange-700"></i>
        </div>
        <div>
          <h3 class="font-semibold text-orange-800">ASKUIU Assistant</h3>
          <p class="text-xs text-orange-600">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span> Online
          </p>
        </div>
        <div class="ml-auto flex space-x-2">
          <button class="p-2 rounded-full hover:bg-orange-200"><i class="fas fa-phone-alt text-orange-600"></i></button>
          <button class="p-2 rounded-full hover:bg-orange-200"><i class="fas fa-video text-orange-600"></i></button>
          <button class="p-2 rounded-full hover:bg-orange-200"><i class="fas fa-info-circle text-orange-600"></i></button>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-orange-50">
        <!-- Welcome message -->
        <div class="flex items-start space-x-2">
          <div class="w-8 h-8 rounded-full bg-orange-300 flex items-center justify-center">
            <i class="fas fa-robot text-orange-700 text-sm"></i>
          </div>
          <div class="bg-white p-3 rounded-lg shadow border border-orange-100 max-w-md">
            <p class="text-gray-800">Hello! I'm ASKUIU, your friendly assistant. How can I help you today?</p>
            <p class="text-xs text-gray-500 mt-1">Today, 10:00 AM</p>
          </div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator hidden px-4 py-2 bg-orange-100">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-full bg-orange-300 flex items-center justify-center mr-2">
            <i class="fas fa-robot text-orange-700 text-sm"></i>
          </div>
          <div class="flex space-x-1">
            <div class="w-2 h-2 rounded-full bg-orange-500 animate-bounce"></div>
            <div class="w-2 h-2 rounded-full bg-orange-500 animate-bounce delay-150"></div>
            <div class="w-2 h-2 rounded-full bg-orange-500 animate-bounce delay-300"></div>
          </div>
        </div>
      </div>

      <!-- Message Input -->
      <form id="query-form" class="border-t border-orange-200 bg-white p-3">
        <div class="flex items-center">
          <button type="button" class="p-2 rounded-full hover:bg-orange-100 text-orange-600 mr-2">
            <i class="fas fa-paperclip"></i>
          </button>
          <button type="button" class="p-2 rounded-full hover:bg-orange-100 text-orange-600 mr-2">
            <i class="fas fa-image"></i>
          </button>
          <div class="flex-1 relative">
            <input type="text" id="user_message" name="user_message" placeholder="Type your message..."
              class="w-full p-3 pr-12 rounded-full border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-300"/>
            <button type="button"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 p-1 rounded-full hover:bg-orange-100 text-orange-600">
              <i class="far fa-smile"></i>
            </button>
          </div>
          <button type="submit" id="send-button"
            class="ml-2 p-3 rounded-full bg-orange-500 text-white hover:bg-orange-600 transition">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
